name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tests/test_benchmark_schema.py
      - run: python3 -m json.tool benchmarks/schemas/benchmark-schema.json > /dev/null
      - run: |
          python3 -c "import yaml; yaml.safe_load(open('configs/serving-profiles/ollama-lanes.yaml')); yaml.safe_load(open('configs/routing-policies/policies.yaml'))"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
